<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
  <title id="title">DropNest homepage preview</title>
  <desc id="desc">A warm, simple DropNest interface showing local status, file upload, text drop, and recent drops.</desc>
  <rect width="1040" height="720" fill="#f4f1ea"/>
  <rect x="70" y="44" width="900" height="120" rx="18" fill="#fffaf0" stroke="#d8ccba"/>
  <text x="104" y="82" fill="#20584d" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">LOCAL UTILITY</text>
  <text x="104" y="130" fill="#1f1b16" font-family="Arial, sans-serif" font-size="52" font-weight="800">DropNest</text>
  <text x="104" y="154" fill="#70685d" font-family="Arial, sans-serif" font-size="18">Private LAN file and clipboard drop.</text>

  <rect x="70" y="190" width="900" height="170" rx="16" fill="#fffdf8" stroke="#d8ccba"/>
  <text x="104" y="232" fill="#1f1b16" font-family="Arial, sans-serif" font-size="24" font-weight="700">Status</text>
  <rect x="850" y="210" width="74" height="30" rx="15" fill="#f6efe3" stroke="#d8ccba"/>
  <text x="877" y="231" fill="#453d34" font-family="Arial, sans-serif" font-size="14" font-weight="700">LAN</text>
  <rect x="104" y="260" width="390" height="64" rx="12" fill="#f6efe3" stroke="#e5d9c8"/>
  <text x="126" y="285" fill="#70685d" font-family="Arial, sans-serif" font-size="12" font-weight="700">OPEN</text>
  <text x="126" y="309" fill="#1f1b16" font-family="Consolas, monospace" font-size="16">http://192.168.1.25:7070</text>
  <rect x="520" y="260" width="390" height="64" rx="12" fill="#f6efe3" stroke="#e5d9c8"/>
  <text x="542" y="285" fill="#70685d" font-family="Arial, sans-serif" font-size="12" font-weight="700">RECEIVE DIRECTORY</text>
  <text x="542" y="309" fill="#1f1b16" font-family="Consolas, monospace" font-size="16">~/Downloads/DropNest</text>

  <rect x="70" y="386" width="435" height="214" rx="16" fill="#fffdf8" stroke="#d8ccba"/>
  <text x="104" y="428" fill="#1f1b16" font-family="Arial, sans-serif" font-size="24" font-weight="700">Drop a file</text>
  <rect x="104" y="454" width="367" height="88" rx="14" fill="#fff9ed" stroke="#b7aa98" stroke-dasharray="8 7" stroke-width="2"/>
  <text x="246" y="493" fill="#20584d" font-family="Consolas, monospace" font-size="15" font-weight="700">FILE</text>
  <text x="224" y="520" fill="#1f1b16" font-family="Arial, sans-serif" font-size="19" font-weight="700">Choose a file</text>
  <rect x="104" y="556" width="128" height="42" rx="10" fill="#20584d" stroke="#174239"/>
  <text x="130" y="583" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Upload file</text>

  <rect x="535" y="386" width="435" height="214" rx="16" fill="#fffdf8" stroke="#d8ccba"/>
  <text x="569" y="428" fill="#1f1b16" font-family="Arial, sans-serif" font-size="24" font-weight="700">Drop text</text>
  <rect x="569" y="454" width="367" height="92" rx="12" fill="#fffefb" stroke="#c9bba9"/>
  <text x="590" y="488" fill="#70685d" font-family="Arial, sans-serif" font-size="17">Paste a note, link, or command...</text>
  <rect x="569" y="556" width="112" height="42" rx="10" fill="#20584d" stroke="#174239"/>
  <text x="592" y="583" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Send text</text>

  <rect x="70" y="626" width="900" height="54" rx="16" fill="#fffdf8" stroke="#d8ccba"/>
  <text x="104" y="660" fill="#1f1b16" font-family="Arial, sans-serif" font-size="21" font-weight="700">Recent drops</text>
  <text x="792" y="660" fill="#70685d" font-family="Arial, sans-serif" font-size="16">Newest first</text>
</svg>
